---
- name: Import base preparation
  ansible.builtin.import_playbook: prepare.yml

- name: Deploy Redmine N-1 release and N-1 plugins before upgrade test
  hosts: redmine
  vars:
    redmine_version: "{{ lookup('env', 'REDMINE_N1_RELEASE') | default('6', true) }}"
    redmine_plugins:
      - name: redmine_test_plugin
        src: "{{ playbook_dir }}/files/redmine_test_plugin_v1/"
      - name: redmine_code_review
        url: https://github.com/haru/redmine_code_review/releases/download/1.2.1/redmine_code_review-1.2.1.zip
        version: "1.2.1"
  roles:
    - role: redmine

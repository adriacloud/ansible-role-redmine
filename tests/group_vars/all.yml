---
redmine_version: "{{ lookup('env', 'REDMINE_RELEASE') | default('7', true) }}"
redmine_db_password: redmine_test_password
redmine_db:
  adapter: mysql2
  host: "{{ hostvars[groups['infra'][0]]['ansible_facts']['default_ipv4']['address'] }}"
  database: redmine
  username: redmine
  password: "{{ redmine_db_password }}"
redmine_server_name: "{{ ansible_facts['fqdn'] }}"
httpd_pki_setup_host: "{{ inventory_hostname }}"
redmine_load_default_data: true
redmine_plugins:
  - name: redmine_test_plugin
    src: "{{ playbook_dir }}/files/redmine_test_plugin/"
  - name: redmine_code_review
    url: https://github.com/haru/redmine_code_review/releases/download/1.2.2/redmine_code_review-1.2.2.zip
    version: "1.2.2"
redmine_themes:
  - name: redmine_test_theme
    src: "{{ playbook_dir }}/files/redmine_test_theme/"
  - name: bleuclair
    url: https://github.com/farend/redmine_theme_farend_bleuclair/archive/refs/tags/v2.0.3.zip
    version: "2.0.3"
redmine_extra_env:
  REDMINE_TEST_ENV: "configured"
redmine_extra_shared_dirs:
  - custom_shared
redmine_extra_rb_environment:
  molecule_test: |
    config.x.ansible_role_redmine_test = true
  molecule_disabled: ""
redmine_extra_files:
  - dest: config/initializers/ansible_test.rb
    content: |
      # Managed by ansible-role-redmine Molecule test
  - dest: config/ansible_test.yml
    yaml:
      test_key: test_value
redmine_post_migrate_commands:
  - name: Create post-migrate hook marker
    command: "touch {{ redmine_shared_dir }}/custom_shared/hook_ran"
    fact_key: molecule_hook_ran

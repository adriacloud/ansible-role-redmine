---
name: molecule

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-systemd:bookworm
            ansible_version: "2.19"
            release: 6
          - distro: ubuntu-systemd:noble
            ansible_version: "2.19"
            release: 7
          - distro: ubuntu-systemd:resolute
            ansible_version: "2.19"
            release: 6
          - distro: centos-systemd:stream10
            ansible_version: "2.18"
            release: 6
          - distro: rockylinux-systemd:10
            ansible_version: "2.21"
            release: 6
          - distro: ubuntu-systemd:resolute
            ansible_version: "2.21"
            release: 7
          - distro: debian-systemd:trixie
            ansible_version: "2.21"
            release: 7
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "tests/requirements.txt"

      - name: Install Tox
        run: pip install tox

      - name: Run Tox
        id: run_tox
        run: tox -e molecule-deploy
        env:
          DOCKER_IMAGE_TAG: ${{ matrix.distro }}
          REDMINE_RELEASE: ${{ matrix.release }}
          ANSIBLE_VERSION: ${{ matrix.ansible_version }}

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-systemd:resolute
            ansible_version: "2.19"
            n1_release: 6
            release: 7
          - distro: rockylinux-systemd:10
            ansible_version: "2.21"
            n1_release: 6
            release: 7
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "tests/requirements.txt"

      - name: Install Tox
        run: pip install tox

      - name: Run Tox
        id: run_tox
        run: tox -e molecule-upgrade
        env:
          DOCKER_IMAGE_TAG: ${{ matrix.distro }}
          REDMINE_RELEASE: ${{ matrix.release }}
          REDMINE_N1_RELEASE: ${{ matrix.n1_release }}
          ANSIBLE_VERSION: ${{ matrix.ansible_version }}

  letsencrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-systemd:bookworm
            ansible_version: "2.19"
            release: 7
          - distro: centos-systemd:stream10
            ansible_version: "2.21"
            release: 7
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "tests/requirements.txt"

      - name: Install Tox
        run: pip install tox

      - name: Run Tox
        id: run_tox
        run: tox -e molecule-letsencrypt
        env:
          DOCKER_IMAGE_TAG: ${{ matrix.distro }}
          REDMINE_RELEASE: ${{ matrix.release }}
          ANSIBLE_VERSION: ${{ matrix.ansible_version }}

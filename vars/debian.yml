cache_timeout: 600

_redmine_distro_packages:
  - acl
  - build-essential
  - curl
  - git
  - libffi-dev
  - libssl-dev
  - libxml2-dev
  - libxslt1-dev
  - libyaml-dev
  - pkg-config
  - sudo
  - tar
  - unzip
  - xz-utils
  - zlib1g-dev

_redmine_db_adapter_packages:
  mysql2:
    - libmariadb-dev
  trilogy:
    - libmariadb-dev
  postgresql:
    - libpq-dev
  sqlite3:
    - libsqlite3-dev

_redmine_distro_certbot_packages:
  - certbot
  - python3-certbot-apache

_redmine_httpd_extra_modules:
  - name: proxy
    state: present
  - name: proxy_http
    state: present

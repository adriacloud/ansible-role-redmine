---
# Example playbook demonstrating optional database deployment via galera_server
# (https://opendev.org/openstack/openstack-ansible-galera_server) followed by
# Redmine deployment using the redmine role.

- name: Deploy database server with Galera (optional)
  hosts: galera_all
  become: true
  vars:
    galera_root_password: "super-secret-root-password"
    redmine_db_password: "changeme"
  tasks:
    - name: Run galera_server role when enabled
      ansible.builtin.include_role:
        name: galera_server
      when: redmine_deploy_galera | default(true) | bool

    - name: Create Redmine database and user
      when: inventory_hostname == ansible_play_hosts[0]
      block:
        - name: Create Redmine database
          ansible.mariadb.mariadb_db:
            name: redmine
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
            state: present

        - name: Create Redmine database user
          ansible.mariadb.mariadb_user:
            name: redmine
            password: "{{ redmine_db_password }}"
            host: "%"
            priv: "redmine.*:ALL"
            append_privs: true
            state: present
          no_log: true

        - name: Create Redmine database user
          ansible.mariadb.mariadb_user:
            name: redmine
            password: "{{ redmine_mariadb_password }}"
            host: "%"
            priv: "redmine.*:ALL"
            append_privs: true
            state: present
          no_log: true

- name: Installing Redmine
  hosts: redmine
  become: true
  vars:
    redmine_version: "7"
    redmine_server_name: "redmine.example.com"
    redmine_db:
      adapter: "mysql2"
      host: "{{ groups['galera_all'][0] }}"
      database: "redmine"
      username: "redmine"
      password: "{{ redmine_db_password }}"
    redmine_ssl: true
    # Option 1: Let's Encrypt / Certbot
    # redmine_ssl_letsencrypt_enable: true
    # redmine_ssl_letsencrypt_email: "admin@example.com"
    # redmine_ssl_letsencrypt_domains:
    #   - "redmine.example.com"
    # Option 2: User-supplied TLS certificates
    # redmine_user_ssl_cert: "{{ playbook_dir }}/files/ssl/redmine.crt"
    # redmine_user_ssl_key: "{{ playbook_dir }}/files/ssl/redmine.key"
    # redmine_user_ssl_ca_cert: "{{ playbook_dir }}/files/ssl/ca.crt"
    redmine_plugins:
      - name: redmine_code_review
        url: https://github.com/haru/redmine_code_review/releases/download/1.2.2/redmine_code_review-1.2.2.zip
        version: "1.2.2"
      # - name: my_custom_plugin
      #   src: "{{ playbook_dir }}/files/my_custom_plugin/"
      # - name: another_plugin
      #   repo: https://github.com/example/another_plugin.git
      #   version: "main"
  roles:
    - role: adriacloud.redmine

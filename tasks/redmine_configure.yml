- name: Render Redmine configuration
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: "{{ redmine_system_user_name }}"
    group: "{{ redmine_system_group_name }}"
    mode: "0640"
  loop:
    - content: "{{ _redmine_db_configuration | to_nice_yaml(indent=2) }}"
      dest: "{{ _redmine_release_path }}/config/database.yml"
    - content: "{{ _redmine_configuration | to_nice_yaml(indent=2) }}"
      dest: "{{ _redmine_release_path }}/config/configuration.yml"
  notify:
    - Restart redmine

- name: Render Redmine ruby files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ redmine_system_user_name }}"
    group: "{{ redmine_system_group_name }}"
    mode: "0644"
  loop:
    - src: Gemfile.local.j2
      dest: "{{ _redmine_release_path }}/Gemfile.local"
    - src: puma.rb.j2
      dest: "{{ _redmine_release_path }}/config/puma.rb"
  notify:
    - Restart redmine

- name: Validate redmine_plugins and redmine_themes definitions
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - (item.state | default('present') == 'absent') or (item.repo is defined or item.url is defined or item.src is defined)
    fail_msg: >-
      Each item in {{ item._var }} must define 'name' and at least one of 'repo', 'url', or 'src' (unless state is 'absent').
  loop: >-
    {{
      (redmine_plugins | map('combine', {'_var': 'redmine_plugins'}) | list)
      + (redmine_themes | map('combine', {'_var': 'redmine_themes'}) | list)
    }}
  loop_control:
    label: "{{ item._var }}:{{ item.name | default('unnamed') }}"

- name: Discover latest matching Redmine release when exact patch version is not given
  when: (redmine_version | string | trim) is not match('^\d+\.\d+\.\d+$')
  block:
    - name: Fetch Redmine releases directory listing
      ansible.builtin.uri:
        url: "{{ redmine_releases_url }}/"
        return_content: true
        validate_certs: "{{ redmine_download_validate_certs }}"
      register: _redmine_releases_page
      check_mode: false

    - name: Resolve latest matching Redmine version
      vars:
        _redmine_version_str: "{{ redmine_version | string | trim }}"
        _redmine_version_pattern: >-
          {{
            (_redmine_version_str == 'latest') | ternary(
              'redmine-(\d+\.\d+\.\d+)\.tar\.gz',
              'redmine-(' ~ (_redmine_version_str | regex_escape) ~ '(?:\.\d+)+)\.tar\.gz'
            )
          }}
        _redmine_available_versions: >-
          {{
            _redmine_releases_page.content
            | regex_findall(_redmine_version_pattern)
            | unique
            | community.general.version_sort
          }}
      ansible.builtin.set_fact:
        _redmine_resolved_version: "{{ _redmine_available_versions | last | default('') }}"

    - name: Ensure a matching Redmine release was found
      ansible.builtin.assert:
        that:
          - _redmine_resolved_version | length > 0
        fail_msg: >-
          No Redmine release matching '{{ redmine_version }}' was found at {{ redmine_releases_url }}/.

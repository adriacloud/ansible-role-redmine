- name: Stop redmine service
  ansible.builtin.systemd:
    name: "{{ redmine_service_name }}"
    state: stopped
  listen:
    - Restart redmine
    - systemd service changed
    - Update Ruby runtime symlink
    - Update Redmine runtime symlink

- name: Update Ruby runtime symlink
  ansible.builtin.file:
    src: "{{ redmine_ruby_install_dir }}"
    dest: "{{ redmine_ruby_runtime_dir }}"
    state: link
    owner: root
    group: root
    force: true

- name: Update Redmine runtime symlink
  ansible.builtin.file:
    src: "{{ redmine_install_dir }}"
    dest: "{{ redmine_runtime_directory }}"
    state: link
    owner: "{{ redmine_system_user_name }}"
    group: "{{ redmine_system_group_name }}"
    force: true

- name: Start redmine service
  ansible.builtin.systemd:
    name: "{{ redmine_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  listen:
    - Restart redmine
    - systemd service changed
    - Update Ruby runtime symlink
    - Update Redmine runtime symlink

[tox]
minversion = 4.4
skipsdist = True
envlist = linters,molecule-deploy,molecule-upgrade,molecule-letsencrypt

[testenv]
usedevelop = False
deps =
    -r{toxinidir}/tests/requirements.txt
    ansible-core=={env:ANSIBLE_VERSION:2.21}.*
setenv =
    PYTHONUNBUFFERED=1
    ROLE_NAME=redmine
    WORKING_DIR={toxinidir}
passenv =
    DOCKER_REGISTRY
    DOCKER_IMAGE_TAG
    DOCKER_COMMAND
    REDMINE_RELEASE
    HOME
    USER
    http_proxy
    HTTP_PROXY
    https_proxy
    HTTPS_PROXY
    no_proxy
    NO_PROXY

[testenv:linters]
commands =
    ansible-lint

[testenv:molecule-deploy]
# You can use DOCKER_REGISTRY and DOCKER_IMAGE_TAG to switch between
# tested distros. I.e:
# DOCKER_IMAGE_TAG=rockylinux-systemd:10 tox -e molecule-deploy
commands =
    molecule test -s default

[testenv:molecule-upgrade]
passenv =
    {[testenv]passenv}
    REDMINE_N1_RELEASE
commands =
    molecule test -s upgrade

[testenv:molecule-letsencrypt]
commands =
    molecule test -s letsencrypt
